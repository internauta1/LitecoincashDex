name: komodo_defi_framework
description: "A Flutter plugin for the Komodo DeFi Framework, supporting both
  native (FFI) and web (WASM) platforms."
version: 0.6.0

repository: https://github.com/GLEECBTC/komodo-defi-sdk-flutter
homepage: https://www.gleec.com
issue_tracker: https://github.com/GLEECBTC/komodo-defi-sdk-flutter/issues
topics:
  - komodo
  - defi
  - blockchain
  - wallet

environment:
  sdk: '>=3.9.0 <4.0.0'
  # Minimum Flutter version is set quite high for build transformer capabilities.
  # If this is too high for your project, this can be lowered by commenting out
  # the following line and running the build transformer manually via CLI.
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  # aws_client: ^0.6.0
  decimal: ^3.2.1
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.4.0
  komodo_coin_updates: ^2.1.1
  komodo_coins: ^0.4.0
  komodo_defi_rpc_methods: ^0.7.0
  komodo_defi_types: ^0.6.0
  komodo_wallet_build_transformer: ^0.5.0
  logging: ^1.3.0
  mutex: ^3.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.14
  # build_web_compilers: ^4.0.10
  ffigen: ^19.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0
  yaml: ^3.1.2

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      web:
        pluginClass: KomodoDefiFrameworkWeb
        fileName: web/kdf_plugin_web.dart

  assets:
    - assets/config/
    - assets/coin_icons/png/
    - app_build/build_config.json
    - assets/web/
    
  # Uncomment this section if you need to include any font assets
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
